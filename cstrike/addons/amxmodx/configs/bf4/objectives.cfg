// Independent objective modes. Reload the map after changing settings/layout.
// Keep csflags.amxx and bf4_game_conquest.amxx disabled.
bf4_objective_mode "off" // off | domination | conquest

// Tunable CS adaptation defaults, not verified official BF4 constants.
bf4_domination_tickets "100"
bf4_conquest_tickets "400"
bf4_objective_capture_time "10" // seconds per neutralization/capture stage, one player
bf4_objective_respawn_delay "5" // seconds; resurrection does not spend a ticket
bf4_objective_bleed_interval "2"
bf4_objective_bleed_amount "1" // enemy tickets per majority interval
bf4_objective_time_limit "0" // active minutes; 0 disables the match time limit
bf4_objective_min_players "2" // at least one participant on each team is also required
